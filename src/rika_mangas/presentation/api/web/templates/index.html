<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rika Mangas — Color Engine</title>
    <link rel="stylesheet" href="/static/styles/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="brand-title">Rika Mangas</span>
            <span class="brand-badge">Offline · 6GB Target</span>
        </div>
        <div class="engine-status">
            <span id="status-dot" class="status-dot"></span>
            <span id="engine-status-text">Listo</span>
        </div>
    </header>

    <main class="workspace-grid">
        <aside class="sidebar">
            <!-- 1. Entrada -->
            <section class="card">
                <span class="card-title">1. Entrada</span>
                <div class="field">
                    <label>Páginas B&amp;N</label>
                    <div class="file-dropzone" id="zone-pages" role="button" tabindex="0">
                        <span id="label-pages">Hacer clic o arrastrar páginas (PNG / JPG)</span>
                    </div>
                    <input type="file" id="input-pages" multiple accept="image/png, image/jpeg">
                </div>
                <div class="field">
                    <label>Referencias (Opcional)</label>
                    <div class="file-dropzone" id="zone-refs" role="button" tabindex="0">
                        <span id="label-refs">Hacer clic o arrastrar referencias</span>
                    </div>
                    <input type="file" id="input-refs" multiple accept="image/png, image/jpeg">
                </div>
                <button type="button" id="btn-upload" class="btn btn-primary">Cargar Lote</button>
            </section>

            <!-- 2. Procesamiento -->
            <section class="card" id="card-execution" style="display: none;">
                <span class="card-title">2. Inferencia</span>
                <button type="button" id="btn-start" class="btn btn-primary">Iniciar Colorización</button>
                <div class="progress-rail">
                    <div id="progress-track" class="progress-track"></div>
                </div>
                <span id="progress-text" class="progress-status">En cola...</span>
                <a id="btn-download" class="btn btn-secondary" style="display: none;" download>Descargar Archivo (.ZIP)</a>
            </section>

            <!-- 3. Retoque Interactivo -->
            <section class="card" id="card-touchup" style="display: none;">
                <span class="card-title">3. Retoque LAB</span>
                <div class="field">
                    <label for="page-selector">Página Activa</label>
                    <select id="page-selector"></select>
                </div>
                <div class="field">
                    <label>Tono de Reemplazo</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="color-picker" value="#f0c8a0">
                        <span id="color-hex" class="color-hex-label">#F0C8A0</span>
                    </div>
                </div>
                <div class="field">
                    <label for="tolerance-slider">
                        <span>Tolerancia de Bote</span>
                        <span id="tolerance-val" class="val-indicator">18</span>
                    </label>
                    <input type="range" id="tolerance-slider" min="5" max="50" value="18">
                </div>
                <button type="button" id="btn-undo" class="btn btn-secondary">Deshacer Último Trazo</button>
            </section>
        </aside>

        <!-- Lienzo Viewport -->
        <section class="viewport">
            <div class="viewport-toolbar">
                <span id="viewport-resolution">0 × 0 px</span>
                <span id="viewport-coords">X: 0 | Y: 0</span>
            </div>
            <div class="canvas-container">
                <div class="canvas-frame">
                    <canvas id="view-canvas"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
